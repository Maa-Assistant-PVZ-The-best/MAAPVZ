name: android-release-build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Artifact version (defaults to the current ref)
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: Version used in artifact names
        required: true
        type: string
      distribution:
        description: Artifact distribution label (internal / public)
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

concurrency:
  group: android-release-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        abi: [arm64-v8a, x86_64]
    env:
      APK_ARTIFACT_NAME: MaaPVZ-android-${{ inputs.distribution || 'internal' }}-release-${{ matrix.abi }}-${{ inputs.version || github.ref_name }}
      MAPPING_ARTIFACT_NAME: MaaPVZ-android-${{ inputs.distribution || 'internal' }}-release-mapping-${{ matrix.abi }}-${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: Android/MaaFwApp/gradle/wrapper/gradle-wrapper.properties

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Cache MaaFramework and agent core (${{ matrix.abi }})
        uses: actions/cache@v4
        with:
          path: |
            Android/MaaFwApp/.maa-cache
            Android/MaaFwApp/.maafw
          key: android-native-${{ runner.os }}-fw5.13.0-${{ matrix.abi }}
          restore-keys: |
            android-native-${{ runner.os }}-

      - name: Write local.properties
        run: |
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT}"
            echo "pi.profile=../profile.yaml"
            echo "build.releaseAbi=${{ matrix.abi }}"
          } > Android/MaaFwApp/local.properties

      - name: Prepare PI tree
        run: python Android/prepare_android_pi.py

      - name: Fetch MaaFramework native libs (${{ matrix.abi }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python Android/MaaFwApp/scripts/setup_maa_framework.py --abi ${{ matrix.abi }} --tag v5.13.0

      - name: Pack agent runtime (${{ matrix.abi }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python Android/MaaFwApp/scripts/build_agent_bundle.py --out Android/agent-dist \
            --abi arm64-v8a --abi x86_64 \
            --requirements requirements.txt \
            --exclude onnxruntime --extra-index-url https://chaquo.com/pypi-13.1/

      # 未签名 APK 在真机上根本装不上（INSTALL_PARSE_FAILED_NO_CERTIFICATES：
      # 没有任何 v1/v2 签名 → 解析期就失败），所以这里不能"告警一下继续"：
      # 公开发版缺材料直接失败，内部包降级成一次性 debug key 签名，保证产物可安装。
      - name: Prepare release signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DISTRIBUTION: ${{ inputs.distribution || 'internal' }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "签名材料：仓库 Secrets"
            exit 0
          fi

          if [ "$DISTRIBUTION" = "public" ]; then
            echo "::error::公开发版必须配齐 ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD；未签名 APK 装不上，不能作为发布产物"
            exit 1
          fi

          # 内部包只需要能装到设备上测试。用一次性 debug key：可安装，但公钥与正式 key 不同，
          # 无法冒充正式包（公开发版走上面那条 secrets 分支，拿不到正式 key 会先失败）
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.jks" -storetype PKCS12 \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" > /dev/null
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/debug.jks"
            echo "KEYSTORE_PASSWORD=android"
            echo "KEY_ALIAS=androiddebugkey"
            echo "KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"
          echo "::warning::内部包未配正式签名材料，已用一次性 debug key 签名：可安装，但不是正式签名"

      - name: Assemble release APK (${{ matrix.abi }})
        working-directory: Android/MaaFwApp
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      # 门禁：签名配置丢了 / secrets 没传到 / 打包用了别的 key，都在这里拦下来，
      # 而不是等用户装不上才发现。
      # 必须按 ZIP 结构定位 APK Signing Block：它紧贴中央目录之前，而中央目录本身
      # 可能有几 MB（127MB 的包就是），"只看文件尾 64KB 找魔数"会漏判成未签名。
      - name: Verify release APK is signed
        working-directory: Android/MaaFwApp
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import os
          import struct
          import subprocess
          import sys
          import zipfile
          from pathlib import Path

          EOCD_SIG = b"PK\x05\x06"
          Z64_LOC_SIG = b"PK\x06\x07"
          APK_SIG_MAGIC = b"APK Sig Block 42"
          SCHEMES = {0x7109871A: "v2", 0xF05368C0: "v3"}


          def signing_block(data):
              """按 ZIP 结构定位 APK Signing Block；返回 (块内 (id, value) 列表, 中央目录偏移)"""
              tail = max(0, len(data) - (22 + 65535))
              eocd = data.rfind(EOCD_SIG, tail)
              if eocd < 0:
                  return [], -1
              entries = struct.unpack_from("<H", data, eocd + 10)[0]
              cd_offset = struct.unpack_from("<I", data, eocd + 16)[0]
              # 条目数/CD 偏移溢出说明是 ZIP64，真偏移在 ZIP64 EOCD 里
              if cd_offset == 0xFFFFFFFF or entries == 0xFFFF:
                  loc = data.rfind(Z64_LOC_SIG, max(0, eocd - 64), eocd)
                  if loc < 0:
                      return [], -1
                  z64_eocd = struct.unpack_from("<Q", data, loc + 8)[0]
                  cd_offset = struct.unpack_from("<Q", data, z64_eocd + 48)[0]
              if cd_offset < 32 or data[cd_offset - 16 : cd_offset] != APK_SIG_MAGIC:
                  return [], cd_offset
              # 块尾是 [uint64 块长][16 字节魔数]，块首是 [uint64 同值]
              trailing = struct.unpack_from("<Q", data, cd_offset - 24)[0]
              start = cd_offset - 8 - trailing
              if start < 0:
                  return [], cd_offset
              pairs = []
              pos = start + 8
              end = cd_offset - 24
              while pos + 12 <= end:
                  size = struct.unpack_from("<Q", data, pos)[0]
                  if size < 4 or pos + 8 + size > end:
                      break
                  pairs.append((struct.unpack_from("<I", data, pos + 8)[0], data[pos + 12 : pos + 8 + size]))
                  pos += 8 + size
              return pairs, cd_offset


          def lp(buf, off):
              (n,) = struct.unpack_from("<I", buf, off)
              return buf[off + 4 : off + 4 + n], off + 4 + n


          def v2_cert(pairs):
              """v2 块里第一张证书的 DER；结构不认识就返回 None（只用于比对，不参与签名判定）"""
              for pid, value in pairs:
                  if pid != 0x7109871A:
                      continue
                  try:
                      signers, _ = lp(value, 0)
                      signer, _ = lp(signers, 0)
                      signed, _ = lp(signer, 0)
                      _digests, off = lp(signed, 0)
                      certs, _ = lp(signed, off)
                      cert, _ = lp(certs, 0)
                      return cert
                  except (struct.error, IndexError):
                      return None
              return None


          apk_dir = Path("app/build/outputs/apk/release")
          apks = sorted(apk_dir.glob("*.apk"))
          if len(apks) != 1:
              print(f"❌ {apk_dir} 下应有且仅有 1 个 APK，实际 {len(apks)} 个")
              sys.exit(1)
          apk = apks[0]
          print(f"APK: {apk.name} ({apk.stat().st_size} bytes)")
          if apk.name.endswith("-unsigned.apk"):
              print("❌ 文件名是 app-release-unsigned.apk：AGP 没有套用任何 signingConfig")
              sys.exit(1)

          data = apk.read_bytes()
          with zipfile.ZipFile(apk) as z:
              v1 = [
                  n for n in z.namelist()
                  if n.startswith("META-INF/") and n.upper().endswith((".RSA", ".DSA", ".EC"))
              ]

          pairs, cd_offset = signing_block(data)
          schemes = sorted({SCHEMES.get(pid, f"0x{pid:08x}") for pid, _ in pairs})
          print(f"中央目录偏移: {cd_offset}")
          print(f"v1 签名: {v1 or '无'}（minSdk >= 24 的包本来就只有 v2/v3，不算问题）")
          print(f"v2/v3 签名块: {'有（' + ', '.join(schemes) + '）' if pairs else '无'}")

          if not (v1 or pairs):
              print("❌ APK 没有任何签名，装不上；检查签名 secrets 与 signingConfig")
              sys.exit(1)

          cert = v2_cert(pairs)
          got = hashlib.sha256(cert).hexdigest() if cert else ""
          if got:
              print(f"APK 证书 SHA-256: {got}")

          keystore = os.environ.get("KEYSTORE_PATH", "").strip()
          alias = os.environ.get("KEY_ALIAS", "").strip()
          store_pass = os.environ.get("KEYSTORE_PASSWORD", "").strip()
          if got and keystore and alias and store_pass:
              exported = subprocess.run(
                  ["keytool", "-exportcert", "-rfc", "-alias", alias,
                   "-keystore", keystore, "-storepass", store_pass],
                  capture_output=True, text=True,
              )
              pem = "".join(
                  line for line in (exported.stdout or "").splitlines()
                  if not line.startswith("-----")
              )
              expected = hashlib.sha256(base64.b64decode(pem)).hexdigest() if pem else ""
              if not expected:
                  print("⚠️ 没能从 keystore 导出证书，跳过一致性比对")
              elif expected != got:
                  print(f"❌ 包是用别的 key 签的：APK={got} keystore={expected}")
                  print("   这种包装到老版本上会签名冲突，必须用同一把 key 重打")
                  sys.exit(1)
              else:
                  print(f"✅ 签名证书与 keystore 一致（{expected[:16]}…）")
          elif not got:
              print("（未从 v2 块解出证书，跳过 keystore 一致性比对）")

          print("✅ APK 已签名")
          PY

      # ===== 校验安卓端 Mirror酱 rid 是 MaaPVZ_exec =====
      # MaaFwApp 以 profile 的 update.mirrorchyanRid 覆盖 interface.json 的值，
      # 包内那份（prepare_android_pi.py 打的补丁）是保险，防外壳静默不认该字段。
      # PI 不打散装：build-logic 的 packPiArchive 会打成 assets/pi.zip，
      # 所以从 APK 取 pi.zip 读里面那份；顺带兼容将来改回散装。
      # 用 Python 不用 shell：嵌套 zip 干净，避开 pipefail 下 grep -q 提前退出
      # 把上游 unzip 打成 SIGPIPE 的假失败。
      - name: Verify android Mirror酱 rid
        working-directory: Android/MaaFwApp
        run: |
          python - <<'PY'
          import io
          import sys
          import zipfile
          from pathlib import Path

          RID = "MaaPVZ_exec"
          OLD = '"mirrorchyan_rid": "MaaPVZ",'
          NEW = f'"mirrorchyan_rid": "{RID}"'
          apk_dir = Path("app/build/outputs/apk/release")
          apks = sorted(apk_dir.glob("*.apk"))
          if len(apks) != 1:
              print(f"❌ {apk_dir} 下应有且仅有 1 个 APK，实际 {len(apks)} 个")
              sys.exit(1)
          APK = apks[0]

          def read_interface(apk):
              with zipfile.ZipFile(apk) as z:
                  names = z.namelist()
                  archives = [n for n in names if n.endswith("pi.zip")]
                  loose = [n for n in names if n.endswith("interface.json")]
                  if archives:
                      entry = archives[0]
                      with zipfile.ZipFile(io.BytesIO(z.read(entry))) as pi:
                          inner = pi.namelist()
                          hit = [n for n in inner if n.endswith("interface.json")]
                          if not hit:
                              print(f"APK 内的 {entry} 里没有 interface.json，前 20 条：")
                              for n in inner[:20]:
                                  print("   ", n)
                              return None, None
                          return f"{entry}!/{hit[0]}", pi.read(hit[0]).decode("utf-8")
                  if loose:
                      return loose[0], z.read(loose[0]).decode("utf-8")
                  print("APK 内既没有 pi.zip、也没有散装 interface.json，前 40 条：")
                  for n in names[:40]:
                      print("   ", n)
                  return None, None

          print(f"APK: {APK} ({APK.stat().st_size} bytes)")
          source, text = read_interface(APK)
          if text is None:
              sys.exit(1)
          print(f"检查: {source}")
          for line in text.splitlines():
              if "mirrorchyan_rid" in line:
                  print("   ", line.strip())
          if OLD in text:
              print("❌ 包内声明的 rid 还是 MaaPVZ，说明打包时没替换成功")
              sys.exit(1)
          if NEW not in text:
              print("❌ 包内声明里找不到 MaaPVZ_exec")
              sys.exit(1)
          print("✅ APK 内 PI 的 mirrorchyan_rid = MaaPVZ_exec")
          PY

      - name: Rename release APK
        working-directory: Android/MaaFwApp
        shell: bash
        run: |
          apk_dir="app/build/outputs/apk/release"
          apks=("$apk_dir"/*.apk)
          if (( ${#apks[@]} != 1 )) || [[ ! -f "${apks[0]}" ]]; then
            echo "Expected exactly one release APK in $apk_dir" >&2
            exit 1
          fi
          mv "${apks[0]}" "$apk_dir/${APK_ARTIFACT_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT_NAME }}
          path: Android/MaaFwApp/app/build/outputs/apk/release/${{ env.APK_ARTIFACT_NAME }}.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MAPPING_ARTIFACT_NAME }}
          path: Android/MaaFwApp/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
