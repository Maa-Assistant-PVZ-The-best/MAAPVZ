name: install

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - ".github/cliff.toml"
      - "assets/**"
      - "agent/**"
      - "tools/**"
      - "**.py"
      - "requirements.txt"
      - "docs/imgs/**"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - ".github/cliff.toml"
      - "assets/**"
      - "agent/**"
      - "tools/**"
      - "**.py"
      - "requirements.txt"
      - "docs/imgs/**"
  workflow_dispatch:
    inputs:
      version:
        description: Artifact version (leave empty to use the CI version)
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: Version used in artifact names
        required: true
        type: string

concurrency:
  group: install-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MFAA_VERSION: v2.16.0
  MAA_FRAMEWORK_VERSION: v5.12.2

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: set_tag
        run: |
          requested_version="${{ inputs.version }}"
          if [[ -n "$requested_version" ]]; then
            echo "tag=$requested_version" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || true)
          if [[ "$latest_tag" != v* ]]; then
            latest_tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
          fi
          if [[ "$latest_tag" != v* ]]; then
            latest_tag="v0.0.0"
          fi

          short_sha=$(git rev-parse --short HEAD)
          date_str=$(date +%y%m%d)
          tag="${latest_tag}-ci.${date_str}-${short_sha}"

          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"

  changelog:
    name: Generate changelog
    needs: [meta]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.ref }}

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          args: >-
            -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Write changelog to announcement file
        run: |
         mkdir -p announcement
         cp CHANGES.md announcement/

      - name: Upload announcement artifact
        uses: actions/upload-artifact@v4
        with:
          name: announcement
          path: announcement/
          if-no-files-found: error

  install:
    needs: [meta, changelog]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: win
            arch: x86_64
            runner: windows-latest
          # - os: win
          #   arch: aarch64
          #   runner: windows-11-arm
          - os: macos
            arch: x86_64
            runner: macos-15-intel
          # - os: macos
          #   arch: aarch64
          #   runner: macos-latest
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
          # - os: linux
          #   arch: aarch64
          #   runner: ubuntu-latest
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Download announcement artifact
        uses: actions/download-artifact@v4
        with:
          name: announcement
          path: assets/resource/announcement
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-${{ matrix.os }}-${{ matrix.arch }}*"
          tag: ${{ env.MAA_FRAMEWORK_VERSION }}
          out-file-path: "deps"
          extract: true

      - name: Debug deps content
        shell: bash
        run: |
          echo "Current directory:"
          pwd
          echo "deps directory content:"
          ls -la deps/
          echo "deps/bin exists? $([ -d deps/bin ] && echo YES || echo NO)"

      - name: Download MFAAvalonia
        if: matrix.os != 'android'
        id: download_mfa
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MFAAvalonia
          fileName: "MFAAvalonia-*-${{ (matrix.os == 'win' && 'win') || (matrix.os == 'macos' && 'osx') || (matrix.os == 'linux' && 'linux') }}-${{ (matrix.arch == 'x86_64' && 'x64') || (matrix.arch == 'aarch64' && 'arm64') }}*"
          tag: ${{ env.MFAA_VERSION }}
          out-file-path: "MFA"
          extract: true

      - name: Modify MFAAvalonia exe icon
        if: matrix.os == 'win' && matrix.arch == 'x86_64'
        shell: bash
        run: |
          curl -L https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe -o rcedit.exe
          ./rcedit.exe "MFA/MFAAvalonia.exe" --set-icon "docs/imgs/logo.ico"

      - name: Clean up MFAAvalonia archive
        if: matrix.os != 'android'
        shell: bash
        run: |
          ARCHIVE_FILE_PATH="${{ fromJson(steps.download_mfa.outputs.downloaded_files)[0] }}"
          rm -f "${ARCHIVE_FILE_PATH}"
          echo "Archive cleanup command executed for MFAAvalonia."

      - name: Remove built-in runtime in MFA
        if: matrix.os != 'android'
        shell: bash
        run: |
          rm -rf MFA/runtimes

      - name: Setup Embed Python
        if: matrix.os != 'linux' && matrix.os != 'android'
        shell: bash
        run: |
          python tools/ci/setup_embed_python.py ${{ matrix.os }} ${{ matrix.arch }}
          if [[ "${{ matrix.os }}" == "macos" ]]; then
            EMBED_PYTHON_PATH="./install/python/bin/python3"
            if [ -f "$EMBED_PYTHON_PATH" ]; then
              chmod +x "$EMBED_PYTHON_PATH"
            else
              echo "Warning: Embedded Python executable not found at $EMBED_PYTHON_PATH. Skipping chmod."
            fi
          fi

      - name: Fix permissions on unix
        if: matrix.os != 'win'
        shell: bash
        run: |
          if [ -d "./install/python/bin" ]; then
            chmod +x ./install/python/bin/* 2>/dev/null || true
          fi
          if [ -d "./install" ]; then
            find ./install -type f -name "*.sh" -exec chmod +x {} \; 2>/dev/null || true
          fi

      - name: Install on unix
        if: matrix.os != 'win'
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" != "android" ]]; then
            if [ -d "MFA" ]; then
              echo "Copying MFA files to install directory..."
              mkdir -p install
              rsync -av --ignore-existing MFA/ install/
              echo "MFA files copied successfully."
            else
              echo "MFA directory not found, skipping copy."
            fi
          else
            echo "Skipping copy MFA for Android."
          fi

          cd tools/
          python -m pip install -r ./requirements.txt
          python ./install.py ${{ needs.meta.outputs.tag }} ${{ matrix.os }} ${{ matrix.arch }}
          cd ..

      - name: Install on windows
        if: matrix.os == 'win'
        shell: bash
        run: |
          echo "=== Debug before install.py ==="
          ls -la deps/
          ls -la deps/bin/ || echo "deps/bin not found"
          echo "=== End debug ==="

          if [[ "${{ matrix.os }}" != "android" ]]; then
            if [ -d "MFA" ]; then
              echo "Copying MFA files to install directory..."
              mkdir -p install
              cp -r MFA/* install/
              echo "MFA files copied successfully."
            else
              echo "MFA directory not found, skipping copy."
            fi
          else
            echo "Skipping copy MFA for Android."
          fi

          cd tools/
          python -m pip install -r ./requirements.txt
          python ./install.py ${{ needs.meta.outputs.tag }} ${{ matrix.os }} ${{ matrix.arch }}
          cd ..

      - name: Download Python dependencies on Windows
        if: matrix.os == 'win'
        shell: bash
        run: |
          python tools/ci/download_deps.py --deps-dir ./install/python/Lib/site-packages --os ${{ matrix.os }} --arch ${{ matrix.arch }}

      - name: Download Python dependencies on macOS
        if: matrix.os == 'macos'
        shell: bash
        run: |
          python tools/ci/download_deps.py --deps-dir ./install/python/lib/python3.12/site-packages --os ${{ matrix.os }} --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: MaaPVZ-${{ matrix.os }}-${{ matrix.arch }}-${{ needs.meta.outputs.tag }}
          path: "install"
          if-no-files-found: error
