name: mirrorchyan_release

on:
  workflow_dispatch:
    inputs:
      tag:
        default: ''
        required: false

jobs:
  mirrorchyan:
    if: ${{ github.repository_owner == 'Maa-Assistant-PVZ-The-best' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # filename 必须以 -MFAA.zip 结尾：桌面包现在同前缀、靠 -MFAA / -MXU 后缀区分，
          # 只写 MaaPVZ-win-x86_64-* 会把 MFAA 和 MXU 两个包一起匹配进来。
          - os: win
            arch: x86_64
            filename: 'MaaPVZ-win-x86_64-*-MFAA.zip'
            rid: MaaPVZ
          - os: macos
            arch: x86_64
            filename: 'MaaPVZ-macos-x86_64-*-MFAA.zip'
            rid: MaaPVZ
          - os: linux
            arch: x86_64
            filename: 'MaaPVZ-linux-x86_64-*-MFAA.zip'
            rid: MaaPVZ
          - os: android
            arch: arm64
            filename: 'MaaPVZ-android-public-release-arm64-v8a-*'
            rid: MaaPVZ_exec
    steps:
      - uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: ${{ matrix.filename }}
          mirrorchyan_rid: ${{ matrix.rid }}
          tag: ${{ inputs.tag }}

          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

          owner: Maa-Assistant-PVZ-The-best
          repo: MAAPVZ
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
