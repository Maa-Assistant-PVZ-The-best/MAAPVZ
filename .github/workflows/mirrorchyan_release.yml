name: mirrorchyan_release

on:
  workflow_dispatch:
    inputs:
      tag:
        default: ''
        required: false

jobs:
  mirrorchyan:
    if: ${{ github.repository_owner == 'Maa-Assistant-PVZ-The-best' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: win
            arch: x86_64
            filename: 'MaaPVZ-win-x86_64-*'
            rid: MaaPVZ
          - os: macos
            arch: x86_64
            filename: 'MaaPVZ-macos-x86_64-*'
            rid: MaaPVZ
          - os: linux
            arch: x86_64
            filename: 'MaaPVZ-linux-x86_64-*'
            rid: MaaPVZ
          - os: android
            arch: arm64
            filename: 'MaaPVZ-android-arm64-*'
            rid: MaaPVZ_exec
    steps:
      - uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: ${{ matrix.filename }}
          mirrorchyan_rid: ${{ matrix.rid }}
          tag: ${{ inputs.tag }}

          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

          owner: Maa-Assistant-PVZ-The-best
          repo: MAAPVZ
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
