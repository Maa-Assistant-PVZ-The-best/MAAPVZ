name: android-ci

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/android-release-build.yml"
      - "Android/**"
      - "assets/**"
      - "agent/**"
      - "requirements.txt"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/android-release-build.yml"
      - "Android/**"
      - "assets/**"
      - "agent/**"
      - "requirements.txt"
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug:
    name: internal-debug (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: Android/MaaFwApp/gradle/wrapper/gradle-wrapper.properties

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # 内核版本与桌面端 maafw（requirements.txt）对齐；升级时连缓存 key 一起改
      - name: Cache MaaFramework and agent core
        uses: actions/cache@v4
        with:
          path: |
            Android/MaaFwApp/.maa-cache
            Android/MaaFwApp/.maafw
          key: android-native-${{ runner.os }}-fw5.13.0-${{ matrix.abi }}
          restore-keys: |
            android-native-${{ runner.os }}-

      - name: Write local.properties
        run: |
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT}"
            echo "pi.profile=../profile.yaml"
            echo "build.debugAbi=${{ matrix.abi }}"
          } > Android/MaaFwApp/local.properties

      - name: Prepare PI tree
        run: python Android/prepare_android_pi.py

      - name: Fetch MaaFramework native libs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python Android/MaaFwApp/scripts/setup_maa_framework.py --abi ${{ matrix.abi }} --tag v5.13.0

      - name: Pack agent runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python Android/MaaFwApp/scripts/build_agent_bundle.py --out Android/agent-dist \
            --abi arm64-v8a --abi x86_64 \
            --requirements requirements.txt \
            --exclude onnxruntime --extra-index-url https://chaquo.com/pypi-13.1/

      - name: Patch pure.zip namespace packages
        run: python tools/ci/patch_pure_zip.py Android/agent-dist

      - name: Assemble debug APK
        working-directory: Android/MaaFwApp
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Rename debug APK
        working-directory: Android/MaaFwApp
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
          "app/build/outputs/apk/debug/MaaPVZ-android-internal-debug-${{ matrix.abi }}-${{ github.sha }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MaaPVZ-android-internal-debug-${{ matrix.abi }}-${{ github.sha }}
          path: Android/MaaFwApp/app/build/outputs/apk/debug/MaaPVZ-android-internal-debug-${{ matrix.abi }}-${{ github.sha }}.apk
          if-no-files-found: error

  release:
    name: internal-release
    permissions:
      contents: read
    uses: ./.github/workflows/android-release-build.yml
    with:
      version: ${{ github.sha }}
      distribution: internal
    secrets: inherit
